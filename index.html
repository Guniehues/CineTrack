<!DOCTYPE html>
<html lang="en">

            <h2>Adicionar filme</h2>
            <form id="form-file">

                <label>Status<br> <input type=""><br> </label>

                <label>Comentário<br> <input type="text"><br> </label>

                <br><br>
                <button type="button">Cancelar</button> <button type="submit">Salvar</button>
