<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineTrack</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1><strong>CineTrack</strong></h1>
        <input type="search" placeholder="Buscar filme..." aria-label="Buscar título"><button type="button">+ Adicionar</button>
    </header>


    <nav aria-label="Filtros de Status">
        <button type="button" class="ativo" data-status = "todos">Todos <span class="contador"></span></button>
        <button type="button" data-status = "assistido">Assistido <span class="contador"></span></button>
        <button type="button" data-status = "assistindo">Assistindo <span class="contador"></span></button>
        <button type="button" data-status = "quero">Quero assistir <span class="contador"></span></button>
    </nav>

    <main>
        <section id="lista" aria-live="polite">

        </section>
    </main>



    <footer>
        <p>&copy; 2025 CineTrack</p>
    </footer>

    <div id="modal" hidden>
        <div class="modal-conteudo">
            <h2 id="titulo-modal">Adicionar filme</h2>
            <form id="form-filme">
                <label for="titulo">Título</label>
                <input type="text" id="titulo" name="titulo" required>

                <label for="ano">Ano</label>
                <input type="number" id="ano" name="ano" min="1888" max="2030" step="1" required>

                <label for="genero">Gênero</label>
                <input type="text" id="genero" name="genero" required>

                <label for="poster">URL do pôster</label>
                <input type="url" id="poster" name="poster">

                <label for="status">Status</label>
                <select id="status" name="status" required>
                    <option value="quero">Quero assistir</option>
                    <option value="assistindo">Assistindo</option>
                    <option value="assistido">Assistido</option>
                </select>

                <label for="nota">Nota (1 a 5)</label>
                <input type="number" id="nota" name="nota" min="1" max="5" step="1" required>

                <label for="comentario">Comentário</label>
                <textarea id="comentario" name="comentario"></textarea>

                <div id="erros-form" class="erros" aria-live="polite"></div>

                <button type="button">Cancelar</button> <button type="submit">Salvar</button>
            </form>
        </div>
    </div>


    <script src="app.js"></script>

</body>
</html>
